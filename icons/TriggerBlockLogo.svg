  <!-- eye -->
  <path d="M 554 292 Q 704 192 854 292 Q 704 392 554 292 Z"
        fill="#f0f0f0" stroke="#104080" stroke-width="12" stroke-linejoin="round"/>
  <g clip-path="url(#eyeClip)">
    <circle cx="704" cy="292" r="62" fill="#1060b0"/>
    <circle cx="704" cy="292" r="28" fill="#101820"/>
    <circle cx="724" cy="270" r="11" fill="#f0f0f0"/>
  </g>
</svg>

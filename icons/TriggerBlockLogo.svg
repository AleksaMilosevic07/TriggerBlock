<svg xmlns="http://www.w3.org/2000/svg" width="1408" height="768" viewBox="0 0 1408 768">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1060b0"/>
      <stop offset="1" stop-color="#104080"/>
    </linearGradient>
    <clipPath id="eyeClip">
      <path d="M 554 292 Q 704 192 854 292 Q 704 392 554 292 Z"/>
    </clipPath>
  </defs>

  <!-- diagonal band -->
  <rect x="-200" y="214" width="1808" height="160" fill="#f0f0f0" transform="rotate(-14 704 294)"/>

  <!-- shield -->
  <path d="M 514 170 Q 704 148 894 170 C 894 330 862 500 704 640 C 546 500 514 330 514 170 Z"
